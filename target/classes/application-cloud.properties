# Perfil para la nube (Render/Railway/Heroku) con PostgreSQL administrado. Se activa con SPRING_PROFILES_ACTIVE=cloud.
# Acepta DB_URL completa (jdbc:postgresql://host:5432/base) o sus partes DB_HOST, DB_PORT y DB_NAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Todos los servicios pueden compartir una sola base gratuita: cada uno usa su propio esquema.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:design}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
eureka.client.enabled=false
spring.cloud.discovery.client.simple.instances.sales-service[0].uri=${SALES_URL}
