spring.application.name=design-service
server.port=${PORT:9005}

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigip_design?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Yprogramacion2025}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Seguridad ---
sigip.jwt.secret=${JWT_SECRET:+a7Bb1goFtCSc7TUMrL2S2TJ2hzXRJHb68VnOinThc4=}

# --- Feign hacia sales-service: tiempos límite + circuit breaker ---
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.timelimiter.configs.default.timeout-duration=4s

# --- Descubrimiento y monitoreo ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9001/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
